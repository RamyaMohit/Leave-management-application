services:
  - type: web
    name: leave-management-application
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Core app
      - key: APP_NAME
        value: Laravel
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Leave APP_URL unset here — Render auto-injects RENDER_EXTERNAL_URL,
      # and entrypoint.sh copies it into APP_URL at boot (see below)

      # Logging
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error

      # Database — SQLite, no separate DB service needed
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite

      # Drivers — all match your .env.example defaults, no Redis/Memcached needed
      - key: BROADCAST_DRIVER
        value: log
      - key: CACHE_DRIVER
        value: file
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"

      # Mail — mailpit doesn't exist on Render, so log instead of smtp
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: hello@example.com
      - key: MAIL_FROM_NAME
        value: Laravel
